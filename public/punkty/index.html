<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liczenie punktów</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17212B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Punkty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF1;--surface:#FFFFFF;--ink:#17212B;--muted:#5B6976;--line:#D2DAE1;--soft:#F1F4F7;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161D;--surface:#1A232D;--ink:#EDF1F5;--muted:#93A1AE;--line:#2A3642;--soft:#222D38;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#10161D;--surface:#1A232D;--ink:#EDF1F5;--muted:#93A1AE;--line:#2A3642;--soft:#222D38;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 14px 48px}
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:0;flex:1 1 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:6px}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 13px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.wide{width:100%;text-align:left;border-radius:12px;padding:12px 14px}
button:focus-visible,input:focus-visible{outline:3px solid #2F6FD6;outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--line);overflow:hidden;position:relative}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.card-head{display:flex;align-items:center;gap:12px;padding:14px 16px 14px 24px;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.name{flex:1;min-width:0}
.name b{display:block;font-size:1.15rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{color:var(--muted);font-size:.88rem}
.lead .name small{color:var(--ink);font-weight:700}
.total{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.body{padding:0 16px 16px 24px}
.entry-row{display:flex;gap:8px}
.entry-row input{flex:1;min-width:0;font:inherit;font-size:1.5rem;font-weight:700;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
.add,.sub{font:inherit;font-size:1.6rem;font-weight:800;width:58px;border-radius:12px;cursor:pointer;line-height:1}
.add{background:var(--c);color:var(--f);border:0}
.sub{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.hist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font:inherit;font-size:.92rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:8px;padding:4px 9px;cursor:pointer}
.hint{color:var(--muted);font-size:.82rem;margin:8px 0 0}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty p{margin:0 0 16px;font-size:1.05rem}
dialog{border:0;border-radius:20px;padding:20px;background:var(--surface);color:var(--ink);width:min(92vw,420px);max-height:85vh}
dialog::backdrop{background:rgba(10,15,20,.55)}
dialog h2{margin:0 0 12px;font-size:1.3rem}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--c);flex:none}
.prow input,.newp input,.field input{flex:1;min-width:0;width:100%;font:inherit;font-size:1.05rem;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.del{font:inherit;font-size:.9rem;background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.mv{font:inherit;font-size:1.1rem;font-weight:700;width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer;line-height:1}
.mv:disabled{opacity:.3;cursor:default}
.newp{display:flex;gap:8px;margin:14px 0}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.stack{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.stack small{display:block;color:var(--muted);font-weight:400;font-size:.82rem;margin-top:2px}
.status{min-height:1.2em;font-size:.9rem;margin:0 0 12px;color:var(--muted)}
.dlg-foot{display:flex;justify-content:flex-end}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Punkty</h1>
    <div class="actions">
      <button class="btn" id="playersBtn">Gracze</button>
      <button class="btn" id="fileBtn">Plik</button>
      <button class="btn" id="resetBtn">Nowa gra</button>
    </div>
  </header>
  <div class="list" id="list"></div>
</main>

<dialog id="dlg">
  <h2>Gracze</h2>
  <div id="plist"></div>
  <form class="newp" id="newForm">
    <input id="newName" placeholder="Imię gracza" maxlength="24" autocomplete="off">
    <button class="btn primary" type="submit">Dodaj</button>
  </form>
  <div class="dlg-foot"><button class="btn" id="doneBtn">Gotowe</button></div>
</dialog>

<dialog id="fileDlg">
  <h2>Zapis i eksport</h2>
  <label class="field"><span>Nazwa gry (trafi do nazwy pliku)</span>
    <input id="gameName" maxlength="40" placeholder="np. Catan u Tomka" autocomplete="off">
  </label>
  <div class="stack">
    <button class="btn wide" id="saveJson">Zapisz grę do pliku<small>Plik .json, który potem wczytasz z powrotem</small></button>
    <button class="btn wide" id="loadJson">Wczytaj grę z pliku<small>Zastąpi obecną grę</small></button>
    <button class="btn wide" id="saveCsv">Eksportuj tabelę wyników<small>Plik .csv do Excela lub Arkuszy Google</small></button>
  </div>
  <p class="status" id="status" role="status"></p>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <div class="dlg-foot"><button class="btn" id="fileDone">Gotowe</button></div>
</dialog>

<script>
const KEY='licznik-punktow-v1';
const COLORS=[
  {c:'#D64545',f:'#fff'},{c:'#2F6FD6',f:'#fff'},{c:'#E8B21E',f:'#1A1A1A'},{c:'#2E9E5B',f:'#fff'},
  {c:'#8A4FC9',f:'#fff'},{c:'#E4772A',f:'#fff'},{c:'#1FA3A3',f:'#fff'},{c:'#C2408A',f:'#fff'}
];
let state={title:'',players:[],open:null};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.players))state=Object.assign({title:''},s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

const $=id=>document.getElementById(id);
const total=p=>p.entries.reduce((a,b)=>a+b,0);
const fmt=n=>n<0?'−'+Math.abs(n):String(n);
const signed=n=>n<0?'−'+Math.abs(n):(n===0?'0':'+'+n);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function colorOf(p){return COLORS[p.color%COLORS.length];}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function render(focusId){
  $('title').textContent=state.title||'Punkty';
  const list=$('list');list.innerHTML='';
  if(!state.players.length){
    const e=el('div','empty');e.appendChild(el('p',null,'Dodaj graczy albo wczytaj zapisaną grę.'));
    const b=el('button','btn primary','Dodaj graczy');b.onclick=openDlg;e.appendChild(b);
    list.appendChild(e);return;
  }
  const totals=state.players.map(total);
  const anyScore=state.players.some(p=>p.entries.length);
  const max=Math.max(...totals);
  state.players.forEach(p=>{
    const col=colorOf(p),t=total(p),open=state.open===p.id,lead=anyScore&&t===max;
    const card=el('div','card'+(lead?' lead':''));
    card.style.setProperty('--c',col.c);card.style.setProperty('--f',col.f);
    const head=el('button','card-head');head.setAttribute('aria-expanded',open);
    const nm=el('div','name');nm.appendChild(el('b',null,p.name));
    const last=p.entries[p.entries.length-1];
    nm.appendChild(el('small',null,lead?'prowadzi':(p.entries.length?'ostatnio '+signed(last):'dotknij, by dodać punkty')));
    head.appendChild(nm);head.appendChild(el('div','total',fmt(t)));
    head.onclick=()=>{state.open=open?null:p.id;save();render(open?null:p.id);};
    card.appendChild(head);
    if(open){
      const body=el('div','body');
      const row=el('div','entry-row');
      const inp=el('input');inp.type='text';inp.inputMode='numeric';inp.pattern='[0-9]*';
      inp.placeholder='Ile punktów?';inp.id='in-'+p.id;inp.setAttribute('aria-label','Punkty dla '+p.name);
      const add=el('button','add','+');add.setAttribute('aria-label','Dodaj punkty');
      const sub=el('button','sub','−');sub.setAttribute('aria-label','Odejmij punkty');
      const commit=sign=>{const v=parseInt(inp.value.replace(/[^0-9]/g,''),10);if(isNaN(v)){inp.focus();return;}p.entries.push(v===0?0:sign*v);save();render(p.id);};
      add.onclick=()=>commit(1);sub.onclick=()=>commit(-1);
      inp.onkeydown=e=>{if(e.key==='Enter')commit(1);};
      row.append(inp,add,sub);body.appendChild(row);
      if(p.entries.length){
        const h=el('div','hist');
        p.entries.forEach((v,i)=>{const c=el('button','chip',signed(v));
          c.onclick=()=>{if(confirm('Usunąć wpis '+signed(v)+'?')){p.entries.splice(i,1);save();render(p.id);}};h.appendChild(c);});
        body.appendChild(h);body.appendChild(el('p','hint','Dotknij wpisu, żeby go usunąć.'));
      }
      card.appendChild(body);
    }
    list.appendChild(card);
  });
  if(focusId){const i=$('in-'+focusId);if(i)i.focus();}
}

function renderPlayers(){
  const pl=$('plist');pl.innerHTML='';
  state.players.forEach((p,idx)=>{
    const r=el('div','prow');r.style.setProperty('--c',colorOf(p).c);
    r.appendChild(el('span','dot'));
    const i=el('input');i.value=p.name;i.maxLength=24;i.setAttribute('aria-label','Imię gracza');
    i.oninput=()=>{p.name=i.value||'Gracz';save();render();};
    const d=el('button','del','Usuń');
    d.onclick=()=>{if(confirm('Usunąć gracza '+p.name+'?')){state.players.splice(idx,1);if(state.open===p.id)state.open=null;save();renderPlayers();render();}};
    const up=el('button','mv','↑');up.dataset.d='-1';up.setAttribute('aria-label','Przesuń '+p.name+' wyżej');up.disabled=idx===0;up.onclick=()=>movePlayer(idx,-1);
    const dn=el('button','mv','↓');dn.dataset.d='1';dn.setAttribute('aria-label','Przesuń '+p.name+' niżej');dn.disabled=idx===state.players.length-1;dn.onclick=()=>movePlayer(idx,1);
    r.append(i,up,dn,d);pl.appendChild(r);
  });
}
function movePlayer(i,dir){
  const a=state.players,j=i+dir;if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];save();renderPlayers();render();
  const b=document.querySelector('#plist .prow:nth-child('+(j+1)+') .mv[data-d="'+dir+'"]');
  if(b&&!b.disabled)b.focus();
}
function openDlg(){renderPlayers();$('dlg').showModal();}
$('playersBtn').onclick=openDlg;
$('doneBtn').onclick=()=>$('dlg').close();
$('newForm').onsubmit=e=>{
  e.preventDefault();const n=$('newName').value.trim();if(!n)return;
  const used=state.players.map(p=>p.color);
  let color=COLORS.findIndex((_,i)=>!used.includes(i));if(color<0)color=state.players.length%COLORS.length;
  state.players.push({id:newId(),name:n,color,entries:[]});
  $('newName').value='';save();renderPlayers();render();$('newName').focus();
};
$('resetBtn').onclick=()=>{
  if(!state.players.length)return;
  if(confirm('Wyzerować punkty wszystkich graczy?')){state.players.forEach(p=>p.entries=[]);state.open=null;save();render();}
};

/* ---------- Plik: zapis, wczytanie, eksport ---------- */
const status=t=>{$('status').textContent=t;};
$('fileBtn').onclick=()=>{$('gameName').value=state.title||'';status('');$('fileDlg').showModal();};
$('fileDone').onclick=()=>$('fileDlg').close();
$('gameName').oninput=e=>{state.title=e.target.value.trim();save();render();};

function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes());}
function baseName(){const t=(state.title||'gra').replace(/[\\/:*?"<>|]+/g,'').trim().replace(/\s+/g,'-')||'gra';return t+'_'+stamp();}

async function offerFile(filename,data,mime){
  let dl=null;
  if(window.claude&&typeof window.claude.use==='function'){try{dl=await window.claude.use('downloads');}catch(e){}}
  if(dl){
    try{await dl.save({filename,data});status('Zapisano plik '+filename+'.');}
    catch(e){
      if(e&&e.code==='declined')status('Anulowano zapis.');
      else if(e&&e.code==='rate_limited')status('Poczekaj chwilę i spróbuj ponownie.');
      else status('Nie udało się zapisać pliku w tym widoku.');
    }
    return;
  }
  try{
    const blob=new Blob([data],{type:mime});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);status('Zapisano plik '+filename+'.');
  }catch(e){status('Nie udało się zapisać pliku w tej przeglądarce.');}
}

$('saveJson').onclick=()=>{
  if(!state.players.length){status('Najpierw dodaj graczy.');return;}
  const data={app:'licznik-punktow',version:1,savedAt:new Date().toISOString(),title:state.title||'',
    players:state.players.map(p=>({name:p.name,color:p.color,entries:p.entries.slice()}))};
  offerFile(baseName()+'.json',JSON.stringify(data,null,2),'application/json');
};

$('saveCsv').onclick=()=>{
  if(!state.players.length){status('Najpierw dodaj graczy.');return;}
  const q=v=>{v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const n=Math.max(0,...state.players.map(p=>p.entries.length));
  const head=['Gracz'];for(let i=1;i<=n;i++)head.push('Wpis '+i);head.push('Suma');
  const rows=[head.map(q).join(';')];
  state.players.forEach(p=>{const r=[p.name];for(let i=0;i<n;i++)r.push(i<p.entries.length?p.entries[i]:'');r.push(total(p));rows.push(r.map(q).join(';'));});
  offerFile(baseName()+'.csv','\uFEFF'+rows.join('\r\n'),'text/csv');
};

$('loadJson').onclick=()=>{$('fileInput').value='';$('fileInput').click();};
$('fileInput').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    const obj=JSON.parse(await f.text());
    if(!obj||!Array.isArray(obj.players))throw new Error('format');
    const players=obj.players.filter(p=>p&&typeof p.name==='string').map((p,i)=>({
      id:newId()+i,name:p.name.slice(0,24)||'Gracz',
      color:Number.isInteger(p.color)?p.color:i%COLORS.length,
      entries:Array.isArray(p.entries)?p.entries.map(Number).filter(Number.isFinite).map(Math.trunc):[]
    }));
    if(!players.length)throw new Error('empty');
    const hasScores=state.players.some(p=>p.entries.length);
    if(hasScores&&!confirm('Wczytać grę z pliku? Obecne wyniki zostaną zastąpione.')){status('Anulowano wczytywanie.');return;}
    state={title:typeof obj.title==='string'?obj.title.slice(0,40):'',players,open:null};
    save();render();$('gameName').value=state.title;status('Wczytano grę z pliku '+f.name+'.');
  }catch(err){status('To nie jest plik zapisu z tego licznika.');}
};

render();
</script>
</body>
</html>
